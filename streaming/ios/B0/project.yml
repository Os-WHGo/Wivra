# Wivra Meta B0: minimal iOS application for actual glasses-frame verification.
# Generate the Xcode project with XcodeGen. No SDK source is vendored.
name: WivraMetaB0
options:
  bundleIdPrefix: com.oswhgo
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    META_APP_ID: "0"
    CLIENT_TOKEN: ""
packages:
  MetaDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift
    exactVersion: 2.2.5
targets:
  WivraMetaB0:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # W100 (Claude): values shared with the screen-recording extension.
      - path: Shared
      # Localization files for the native shell only; Claude's editor keeps its own i18n.
      - path: Resources
        buildPhase: resources
      # Bundle Claude's actual single-file editor, not a second generated UI.
      # This path is relative to streaming/ios/B0/project.yml.
      - path: ../../../app/dist/agentcut.html
        type: file
        buildPhase: resources
      # Color/filter packs are data, not downloaded executable plugins.
      - path: ../../../app/packs
        type: folder
        buildPhase: resources
    # Keep the checked-in privacy/Meta permissions plist as the single source.
    # XcodeGen 'info.path' REGENERATES the file and silently strips keys unless
    # duplicated under info.properties; use INFOPLIST_FILE instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oswhgo.WivraMetaB0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Info.plist
        # W82 (Claude): original Wivra icon (Resources/Assets.xcassets).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # W100 (Claude): App Group shared with the screen-recording extension only
        # (also available to the free Apple Developer tier; see the W100 doc).
        CODE_SIGN_ENTITLEMENTS: WivraMetaB0.entitlements
    dependencies:
      - package: MetaDAT
        product: MWDATCore
      - package: MetaDAT
        product: MWDATCamera
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      # W100 (Claude): iOS screen recording (ReplayKit), local files only.
      - target: WivraScreenRecord
  WivraScreenRecord:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenRecordExtension
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oswhgo.WivraMetaB0.ScreenRecord
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ScreenRecordExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenRecordExtension/WivraScreenRecord.entitlements
        # Swift 5 language mode for the small ReplayKit callback class.
        SWIFT_VERSION: "5.0"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - sdk: ReplayKit.framework
      - sdk: AVFoundation.framework
