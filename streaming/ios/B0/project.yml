# Wivra Meta B0: minimal iOS application for actual glasses-frame verification.
# Generate the Xcode project with XcodeGen. No SDK source is vendored.
name: WivraMetaB0
options:
  bundleIdPrefix: com.oswhgo
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    META_APP_ID: "0"
    CLIENT_TOKEN: ""
packages:
  MetaDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  WivraMetaB0:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Bundle Claude's actual single-file editor, not a second generated UI.
      # This path is relative to streaming/ios/B0/project.yml.
      - path: ../../../app/dist/agentcut.html
        type: file
        buildPhase: resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oswhgo.WivraMetaB0
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: MetaDAT
        product: MWDATCore
      - package: MetaDAT
        product: MWDATCamera
