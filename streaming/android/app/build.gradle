plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.oswhgo.wivra'
    compileSdk 36
    defaultConfig {
        applicationId 'com.oswhgo.wivra'
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // DAT developer-mode values only. Production registration is separate.
        manifestPlaceholders = [mwdat_application_id: '0', mwdat_client_token: '0']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // One HTML editor source shared with the iOS binary, never a copied fork.
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/wivra-assets'))
}

// Only static HTML and JSON. No cloud, runtime code downloads or paid services.
tasks.register('syncWivraAssets', Sync) {
    from(rootProject.file('../../app/dist')) { include 'agentcut.html' }
    from(rootProject.file('../../app/packs')) { into 'packs' }
    into(layout.buildDirectory.dir('generated/wivra-assets'))
}
tasks.named('preBuild') { dependsOn 'syncWivraAssets' }

// Official Meta Wearables DAT Android artifacts (developer preview).
// Dependency resolution is free via Maven Central. Integration requires
// Meta registration and hardware permissions before any runtime connection.
// Do not enable experimental audio/photo endpoints for public publishing.
dependencies {
    implementation 'com.meta.wearable:mwdat-core:1.0.1'
    implementation 'com.meta.wearable:mwdat-camera:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    // Free Apache-2.0 AndroidX CameraX, same phone cameras across Android devices.
    // No external app/service. Pin one tested stable version to avoid API drift.
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    // Only tests, never a required runtime service or production dependency.
    androidTestImplementation 'com.meta.wearable:mwdat-mockdevice:1.0.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
