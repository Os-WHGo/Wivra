<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgentCut · prueba en teléfono</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --fg:#f2f2f7; --mut:#9a9aa3; --ac:#0a84ff; --bad:#ff453a; --ok:#30d158; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.4 -apple-system, system-ui, sans-serif; padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width:640px; margin-inline:auto; }
  h1 { font-size:22px; margin:16px 0 4px; } h2 { font-size:17px; margin:0 0 8px; }
  p.m { color:var(--mut); margin:0 0 12px; font-size:15px; }
  section { background:var(--card); border-radius:14px; padding:14px; margin:12px 0; }
  button, .btn { display:block; width:100%; min-height:48px; font:inherit; font-weight:600; border:0; border-radius:12px; background:var(--ac); color:#fff; padding:12px; margin:8px 0; text-align:center; }
  button.sec { background:#3a3a3c; } button:disabled { opacity:.4; }
  input, textarea { width:100%; font-size:16px; /* 16px evita el zoom de iOS */ background:#000; color:var(--fg); border:1px solid #3a3a3c; border-radius:10px; padding:10px; }
  textarea { min-height:90px; } label { font-size:14px; color:var(--mut); }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  video { width:100%; max-height:50vh; background:#000; border-radius:10px; }
  .stage { position:relative; } #ov { position:absolute; left:0; right:0; bottom:12%; text-align:center; font-weight:700; font-size:22px; text-shadow:0 0 6px #000; pointer-events:none; }
  .item { padding:8px 0; border-top:1px solid #2c2c2e; font-size:15px; } .item:first-child { border-top:0; }
  #msg { white-space:pre-wrap; font-size:15px; } .ok { color:var(--ok); } .bad { color:var(--bad); }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; }
</style>
</head>
<body>
<h1>AgentCut</h1>
<p class="m">Prueba de teléfono · el video NO sale de tu teléfono · todavía no exporta</p>

<section>
  <h2>1. Tu video</h2>
  <label class="btn" for="file" id="pick">Elegir video del teléfono</label>
  <input id="file" type="file" accept="video/*">
  <p class="m" id="info">Ningún video elegido.</p>
  <div class="stage"><video id="v" playsinline controls></video><div id="ov"></div></div>
  <button id="play" class="sec" disabled>▶ Ver el resultado editado</button>
</section>

<section>
  <h2>2. Edición manual (sin IA)</h2>
  <div class="row"><div><label>Inicio (s)</label><input id="tin" inputmode="decimal" placeholder="2"></div><div><label>Fin (s)</label><input id="tout" inputmode="decimal" placeholder="8"></div></div>
  <button id="trim" disabled>Recortar el primer clip</button>
  <label>Texto en pantalla</label><input id="txt" placeholder="Vancouver">
  <button id="addtxt" class="sec" disabled>Poner texto al inicio (3 s)</button>
  <button id="undo" class="sec" disabled>↩ Deshacer</button>
</section>

<section>
  <h2>3. Con tu IA (gratis, sin clave)</h2>
  <p class="m">Usa ChatGPT o Claude normales. Copias, pegas y vuelves.</p>
  <label>¿Qué quieres que haga?</label>
  <textarea id="ask" placeholder="Deja solo del segundo 2 al 8 y pon el texto Vancouver"></textarea>
  <button id="copy" disabled>① Copiar el mensaje para mi IA</button>
  <label>② Pega aquí la respuesta de la IA</label>
  <textarea id="reply"></textarea>
  <button id="apply" disabled>③ Aplicar</button>
  <div id="msg"></div>
</section>

<section><h2>Línea de tiempo</h2><div id="tl"><p class="m">Vacía.</p></div></section>

<script>
/*__CORE__*/
const $ = (id) => document.getElementById(id);
let session = null, objUrl = null, previewTimer = null;

function say(t, cls) { const m = $('msg'); m.textContent = t; m.className = cls || ''; }
function fmt(n) { return Math.round(n * 100) / 100; }

function render() {
  const p = session?.project;
  const on = !!p;
  for (const id of ['trim','addtxt','copy','apply','play']) $(id).disabled = !on;
  $('undo').disabled = !on || !session.undoStack.length;
  if (!p || (!p.clips.length && !p.texts.length)) { $('tl').innerHTML = '<p class="m">Vacía.</p>'; return; }
  $('tl').innerHTML = p.clips.map(c => `<div class="item"><b>${c.id}</b> · usa ${fmt(c.in)}–${fmt(c.out)} s · empieza en ${fmt(c.start)} s</div>`).join('') +
    p.texts.map(t => `<div class="item"><b>${t.id}</b> · texto “${t.text.replace(/</g,'&lt;')}” · ${fmt(t.start)}–${fmt(t.end)} s</div>`).join('') +
    `<div class="item">Duración total: ${fmt(totalDuration(p))} s · revisión ${p.revision}</div>`;
}

function run(ops) {
  const r = runTool(session, 'edit_apply', { ops, expected_revision: session.project.revision });
  render();
  return r;
}

$('file').addEventListener('change', () => {
  const f = $('file').files[0]; if (!f) return;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  const v = $('v'); v.src = objUrl;
  $('info').textContent = 'Leyendo…';
  v.onloadedmetadata = () => {
    if (!isFinite(v.duration)) { $('info').textContent = 'No pude leer la duración de este video.'; return; }
    const d = Math.round(v.duration * 100) / 100;
    session = new Session(createProject({ assets: [{ id: 'a1', duration: d, name: f.name }] }));
    run([{ op: 'add_clip', asset_id: 'a1' }]);
    $('info').textContent = `${f.name} · ${d} s · ${v.videoWidth}×${v.videoHeight}`;
    say('Video cargado. Ya puedes editar.', 'ok');
  };
  v.onerror = () => { $('info').textContent = 'Este teléfono/navegador no puede reproducir este video.'; };
});

$('trim').onclick = () => {
  const c = session.project.clips[0];
  const r = run([{ op: 'trim_clip', clip_id: c?.id, in: parseFloat($('tin').value.replace(',', '.')), out: parseFloat($('tout').value.replace(',', '.')) }]);
  say(r.ok ? 'Recortado.' : 'No se pudo: ' + r.message, r.ok ? 'ok' : 'bad');
};
$('addtxt').onclick = () => {
  const r = run([{ op: 'add_text', text: $('txt').value, start: 0, duration: 3 }]);
  say(r.ok ? 'Texto agregado.' : 'No se pudo: ' + r.message, r.ok ? 'ok' : 'bad');
};
$('undo').onclick = () => { session.undo(); render(); say('Deshecho.', 'ok'); };

$('copy').onclick = async () => {
  const prompt = buildPrompt($('ask').value || '(escribe qué quieres arriba)', session.project);
  try { await navigator.clipboard.writeText(prompt); say('Copiado. Pégalo en ChatGPT o Claude y copia su respuesta.', 'ok'); }
  catch { $('reply').value = ''; $('ask').value = prompt; say('No pude copiar solo: el mensaje quedó en la caja de arriba; selecciónalo y cópialo.', 'bad'); }
};
$('apply').onclick = () => {
  const ops = parseReply($('reply').value);
  if (!ops) return say('No encontré una lista de operaciones en lo que pegaste. Pídele a la IA: “responde solo con el JSON”.', 'bad');
  const r = run(ops);
  say(r.ok ? `Aplicado (${ops.length} operaciones).` : `La app rechazó la operación ${r.failed_index + 1}: ${r.message}\nNada cambió. Copia este texto y pégaselo a la IA para que corrija.`, r.ok ? 'ok' : 'bad');
};

$('play').onclick = () => {
  const v = $('v'), p = session.project;
  const clips = [...p.clips].sort((a, b) => a.start - b.start);
  if (!clips.length) return;
  clearInterval(previewTimer);
  let i = 0, t0 = 0;
  const go = () => { v.currentTime = clips[i].in; v.play().catch(() => {}); };
  go();
  let elapsed = 0;
  previewTimer = setInterval(() => {
    const c = clips[i];
    const now = clips.slice(0, i).reduce((s, k) => s + (k.out - k.in), 0) + (v.currentTime - c.in);
    $('ov').textContent = p.texts.filter(t => now >= t.start && now < t.end).map(t => t.text).join(' ');
    if (v.currentTime >= c.out - 0.05) {
      if (++i >= clips.length) { v.pause(); clearInterval(previewTimer); $('ov').textContent = ''; } else go();
    }
  }, 100);
};
render();
</script>
</body>
</html>
