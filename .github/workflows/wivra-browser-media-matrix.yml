name: Wivra WebCodecs MediaRecorder isolated browser matrix
on:
  pull_request:
    paths:
      - tools/browser-media-capability-probe.cjs
      - tools/browser-export-roundtrip.cjs
      - tools/browser-long-multipart-export.cjs
      - app/export.mjs
      - app/filters-gl.mjs
      - core/filters.mjs
      - app/export-sink.mjs
      - tools/browser-progressive-export.cjs
      - tools/browser-container-playback.cjs
      - tools/export-engine-benchmark.cjs
      - tools/verify-accelerated-offline-bundle.cjs
      - app/accelerated-cut-renderer.mjs
      - app/accelerated-audio-mixer.mjs
      - app/accelerated-multitrack-renderer.mjs
      - tools/browser-multitrack-accelerated.cjs
      - tools/browser-composition-parity.cjs
      - tools/composition-spatial-case.cjs
      - tools/accelerated-resource-telemetry.cjs
      - tools/accelerated-resource-telemetry.test.cjs
      - app/accelerated-native-sink.mjs
      - app/build.mjs
      - app/accelerated-vendor-pin.mjs
      - app/vendor/mediabunny/**
      - app/accelerated-native-multitrack-export.mjs
      - app/accelerated-storage-budget.mjs
      - app/accelerated-qa-export-ui.mjs
      - tools/browser-accelerated-real-editor.cjs
      - tools/verify-normal-export-safety.cjs
      - app/accelerated-native-codec-probe.mjs
      - app/accelerated-native-multitrack-export.mjs
      - app/accelerated-runtime-identity.mjs
      - app/accelerated-codec-diagnostic.mjs
      - app/accelerated-codec-diagnostic-ui.mjs
      - app/accelerated-codec-diagnostic-journal.mjs
      - app/accelerated-codec-matrix.mjs
      - app/accelerated-codec-matrix-ui.mjs
      - app/tests/accelerated-codec-matrix.test.mjs
      - app/accelerated-avc-compatibility.mjs
      - tools/browser-accelerated-codec-diagnostic.cjs
      - tools/accelerated-codec-diagnostic.test.cjs
      - app/build.mjs
      - app/media-container.mjs
      - app/tests/fixtures/mediarecorder/**
      - .github/workflows/wivra-browser-media-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tester and verify pinned Mediabunny archive
        run: |
          set -euo pipefail
          archive=/tmp/mediabunny-1.61.6.tgz
          expected_sha512='VHEZ53/7jGl4dQ+uOdndsZufFYwEUFWv9UXgvrGun3OapyzoqI9iaPOD7z3xxY/nAttLZBNwswgJzMtGJAquOQ=='
          curl --fail --location --silent --show-error \
            https://registry.npmjs.org/mediabunny/-/mediabunny-1.61.6.tgz \
            --output "$archive"
          actual_sha512="$(openssl dgst -sha512 -binary "$archive" | base64 -w0)"
          if [ "$actual_sha512" != "$expected_sha512" ]; then
            echo "Mediabunny 1.61.6 archive SHA-512/SRI mismatch" >&2
            exit 1
          fi
          npm install --prefix /tmp/wivra-media-lab --no-save --ignore-scripts \
            playwright@1.56.1 "$archive"
          bundle=/tmp/wivra-media-lab/node_modules/mediabunny/dist/bundles/mediabunny.cjs
          test -s "$bundle"
          bundle_sha256="$(sha256sum "$bundle" | cut -d' ' -f1)"
          echo "WIVRA_MEDIABUNNY_SHA256=$bundle_sha256" >> "$GITHUB_ENV"
      - name: Install Linux test browser engines
        run: node /tmp/wivra-media-lab/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Smoke pinned Mediabunny 1.61.6 in an isolated fully offline editor HTML
        run: |
          WIVRA_MEDIABUNNY_BUNDLE=/tmp/wivra-media-lab/node_modules/mediabunny/dist/bundles/mediabunny.cjs node app/build.mjs
          node tools/verify-accelerated-offline-bundle.cjs
          node tools/verify-offline-native-multitrack.cjs
          # Restore the normal editor HTML: accelerated route present but inert (MU V4).
          node app/build.mjs
          node tools/verify-normal-export-safety.cjs
      - name: MU V4 · accelerated export driven from the REAL editor build (pinned Mediabunny loaded on demand)
        run: node tools/browser-accelerated-real-editor.cjs
      - name: Exercise WebCodecs and MediaRecorder with generated local canvas
        run: node tools/browser-media-capability-probe.cjs
      - name: Exercise synthetic exact AVC AAC MP4 diagnostics and safe failures (Linux engines only)
        env:
          DEBUG: pw:browser
        run: |
          node --test app/tests/accelerated-codec-matrix.test.mjs
          node --test tools/accelerated-codec-diagnostic.test.cjs
          node tools/browser-accelerated-codec-diagnostic.cjs
      - name: Inspect synthetic media tracks using ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Verify monitored Chromium PID and RSS on a short real WebCodecs export
        run: |
          node --test tools/accelerated-resource-telemetry.test.cjs
          node tools/browser-multitrack-accelerated.cjs --telemetry-smoke
      - name: Verify both non-contiguous scenes, title rendering attempts and WAV timing
        run: node tools/browser-export-roundtrip.cjs
      - name: Render 81 synthetic cuts and verify output with ffprobe (not Ray-Ban HEVC)
        run: |
          if ! node tools/browser-long-multipart-export.cjs; then
            node -e 'const r=require("./wivra-long-multipart-export.json");const d=Math.abs(r.durationDriftSeconds);if(!(r.pass===false&&r.partCount===81&&r.ffprobe?.video&&r.outputBytes>1000&&Number.isFinite(d)&&d>0.45&&d<=0.75))process.exit(1);'
            mv wivra-long-multipart-export.json wivra-long-multipart-export-first-attempt.json
            echo "Retrying one borderline scheduling drift; the first failure is archived."
            node tools/browser-long-multipart-export.cjs
          fi
      - name: Progressive export to disk through simulated native bridge (byte/CRC/ffmpeg, cancel, disk failure)
        run: node tools/browser-progressive-export.cjs
      - name: Repaired WebM/MP4 show duration and seek in Chromium and WebKit (Linux engines, not iPhone)
        run: node tools/browser-container-playback.cjs
      - name: Compare export engines (MediaRecorder vs WebCodecs+Mediabunny), 30 s montage, A/V markers
        run: node tools/export-engine-benchmark.cjs 30 12
      - name: Verify real accelerated multipista video overlay text and independent WAV via ffprobe (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs
      - name: Verify shared-source video layers preserve distinct decoded pixels (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --shared-source
      - name: Verify 1080p composition, WebGL filters/context loss, format pixels and mixed-speed PCM (Linux only)
        timeout-minutes: 5
        run: node tools/browser-composition-parity.cjs
      - name: Verify spatial crop, vignette, temporal grain, safe captions and overlay GPU loss (Linux only)
        timeout-minutes: 5
        run: node tools/browser-composition-parity.cjs --spatial
      - name: Soak 20 real accelerated cuts and 5 independent voice blocks for 10 seconds (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --stress
      - name: Export 30 seconds of real accelerated multipista (60 cuts 15 voice segments, Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --long
      - name: Verify actual still-photo main video export pixels and seek metadata (Linux only)
        run: node tools/browser-accelerated-main-still.cjs
      - name: Render 60-second accelerated multipista with 120 cuts and 30 independent voice segments (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --minute
      - name: Render bounded 120-second accelerated multipista with 120 cuts and 30 voices (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --two-minute
      - name: Canary 180-second accelerated multipista with 120 cuts and 30 voice blocks (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --three-minute
      - name: Export 30-second real accelerated A/V at 1280x720 and probe mobile AVC/AAC capabilities (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --hd-canary
      - name: Verify exact 150ms video gap in accelerated multipista exported frames (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --gap
      - name: Verify voice ducking survives actual WebCodecs mux and PCM decoding (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs --duck
      - name: Archive evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-WebCodecs-Linux-Browser-Capabilities
          path: |
            wivra-media-capabilities.json
            wivra-accelerated-codec-diagnostic.json
            wivra-export-browser-roundtrip.json
            wivra-long-multipart-export.json
            wivra-long-multipart-export-first-attempt.json
            wivra-progressive-export.json
            wivra-container-playback.json
            wivra-export-engine-benchmark.json
            wivra-multitrack-accelerated.json
            wivra-multitrack-shared-source.json
            wivra-composition-parity.json
            wivra-composition-spatial.json
            wivra-multitrack-stress.json
            wivra-multitrack-long.json
            wivra-multitrack-minute.json
            wivra-multitrack-two-minute.json
            wivra-multitrack-three-minute.json
            wivra-multitrack-hd-canary.json
            wivra-multitrack-gap.json
            wivra-multitrack-duck.json
          if-no-files-found: warn
          retention-days: 7
