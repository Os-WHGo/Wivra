name: Wivra WebCodecs MediaRecorder isolated browser matrix
on:
  pull_request:
    paths:
      - tools/browser-media-capability-probe.cjs
      - tools/browser-export-roundtrip.cjs
      - tools/browser-long-multipart-export.cjs
      - app/export.mjs
      - app/export-sink.mjs
      - tools/browser-progressive-export.cjs
      - tools/browser-container-playback.cjs
      - tools/export-engine-benchmark.cjs
      - tools/verify-accelerated-offline-bundle.cjs
      - app/accelerated-cut-renderer.mjs
      - app/accelerated-native-sink.mjs
      - app/build.mjs
      - app/media-container.mjs
      - app/tests/fixtures/mediarecorder/**
      - .github/workflows/wivra-browser-media-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tester, never app runtime
        run: npm install --prefix /tmp/wivra-media-lab --no-save --ignore-scripts playwright@1.56.1 mediabunny@1.61.6
      - name: Install Linux test browser engines
        run: node /tmp/wivra-media-lab/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Smoke pinned Mediabunny 1.61.6 in an isolated fully offline editor HTML
        run: |
          WIVRA_MEDIABUNNY_BUNDLE=/tmp/wivra-media-lab/node_modules/mediabunny/dist/bundles/mediabunny.cjs node app/build.mjs
          node tools/verify-accelerated-offline-bundle.cjs
          # Restore production-default HTML (no accelerator SDK enabled).
          node app/build.mjs
      - name: Exercise WebCodecs and MediaRecorder with generated local canvas
        run: node tools/browser-media-capability-probe.cjs
      - name: Inspect synthetic media tracks using ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Verify both non-contiguous scenes, title rendering attempts and WAV timing
        run: node tools/browser-export-roundtrip.cjs
      - name: Render 81 synthetic cuts and verify output with ffprobe (not Ray-Ban HEVC)
        run: |
          # Under shared CI load, 81 subsecond MediaRecorder pause/resume cuts
          # can occasionally exceed the strict 450 ms total duration tolerance.
          # One retry is allowed ONLY for a marginal timing drift; actual
          # broken media, missing tracks, crashes or repeated drift remain red.
          if ! node tools/browser-long-multipart-export.cjs; then
            node -e 'const r=require("./wivra-long-multipart-export.json");const d=Math.abs(r.durationDriftSeconds);if(!(r.pass===false&&r.partCount===81&&r.ffprobe?.video&&r.outputBytes>1000&&Number.isFinite(d)&&d>0.45&&d<=0.75))process.exit(1);'
            mv wivra-long-multipart-export.json wivra-long-multipart-export-first-attempt.json
            echo "Retrying one borderline scheduling drift; the first failure is archived."
            node tools/browser-long-multipart-export.cjs
          fi
      - name: Progressive export to disk through simulated native bridge (byte/CRC/ffmpeg, cancel, disk failure)
        run: node tools/browser-progressive-export.cjs
      - name: Repaired WebM/MP4 show duration and seek in Chromium and WebKit (Linux engines, not iPhone)
        run: node tools/browser-container-playback.cjs
      - name: Compare export engines (MediaRecorder vs WebCodecs+Mediabunny), 30 s montage, A/V markers
        run: node tools/export-engine-benchmark.cjs 30 12
      - name: Verify real accelerated multipista video overlay text and independent WAV via ffprobe (Linux only)
        run: node tools/browser-multitrack-accelerated.cjs
      - name: Archive evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-WebCodecs-Linux-Browser-Capabilities
          path: |
            wivra-media-capabilities.json
            wivra-export-browser-roundtrip.json
            wivra-long-multipart-export.json
            wivra-long-multipart-export-first-attempt.json
            wivra-progressive-export.json
            wivra-container-playback.json
            wivra-export-engine-benchmark.json
            wivra-multitrack-accelerated.json
          if-no-files-found: warn
          retention-days: 7
