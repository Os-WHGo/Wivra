name: Wivra Unified Android Native Build
on:
  pull_request:
    paths:
      - 'streaming/android/**'
      - 'app/dist/agentcut.html'
      - 'app/packs/**'
      - '.github/workflows/unified-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-editor-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install free Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile unsigned-debug Android app using Claude HTML
        run: gradle -p streaming/android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify embedded editor and filter pack inside Android APK
        run: |
          set -eu
          apk=streaming/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/agentcut.html'
          unzip -l "$apk" | grep -q 'assets/packs/catalog.json'
          echo "Wivra Android editor resources verified (emulator/device not yet tested)"
      - name: Upload Android debug APK (not production or glasses tested)
        uses: actions/upload-artifact@v4
        with:
          name: WivraUnifiedAndroid-DEBUG
          path: streaming/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
