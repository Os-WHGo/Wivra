name: Meta B0 iOS Native Build
on:
  pull_request:
    paths:
      - 'streaming/ios/B0/**'
      - '.github/workflows/meta-b0-native-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate iOS test application
        working-directory: streaming/ios/B0
        run: xcodegen generate
      - name: Resolve Meta DAT 1.0.1 packages
        working-directory: streaming/ios/B0
        run: xcodebuild -resolvePackageDependencies -project WivraMetaB0.xcodeproj -scheme WivraMetaB0
      - name: Compile iOS Simulator — no signing or hardware claims
        working-directory: streaming/ios/B0
        run: |
          set -o pipefail
          xcodebuild -project WivraMetaB0.xcodeproj \
            -scheme WivraMetaB0 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log
      - name: Summarize errors if build fails
        if: failure()
        working-directory: streaming/ios/B0
        run: |
          if test -f build.log; then
            grep -E '(error:|BUILD FAILED|fatal error:)' build.log | tail -40 || true
          fi
