name: Meta LIVE Preflight Tests
on:
  pull_request:
    paths:
      - 'streaming/**'
      - '.github/workflows/meta-live-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test state transitions and consent gates
        run: node --test streaming/tests/*.test.mjs
      - name: Validate source syntax
        run: node --check streaming/live-preflight.mjs && node --check streaming/hybrid-link-policy.mjs && node --check streaming/irl-resilience.mjs

      - name: Swift B0 syntax grammar (NOT SDK compile)
        run: |
          if command -v swiftc >/dev/null 2>&1; then
            swiftc -frontend -parse streaming/ios/B0/Sources/*.swift
          else
            echo 'swiftc not available on this Linux runner; native compile requires Xcode.'
          fi
