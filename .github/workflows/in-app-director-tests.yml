name: In-App Director and Editor Controls
on:
  pull_request:
    paths:
      - 'core/**'
      - 'app/**'
      - '.github/workflows/in-app-director-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run editor core and on-device director tool tests
        run: cd core && npm test
      - name: Syntax-check new code
        run: node --check core/shoot-checklist.mjs && node --check core/in-app-agent.mjs
      - name: Generate bundled mobile HTML from tested source
        run: node app/build.mjs && test -s app/dist/agentcut.html
      - name: Verify in-app controls exist and no legacy popups
        run: |
          grep -q 'id="dirGenerateChecklist"' app/dist/agentcut.html
          grep -q 'id="dirApplyEdit"' app/dist/agentcut.html
          grep -q 'id="directorCamera"' app/dist/agentcut.html
          if grep -q 'window.prompt' app/template.html; then echo 'Legacy prompt found'; exit 1; fi
