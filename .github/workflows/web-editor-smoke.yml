name: Web editor static smoke test
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-editor-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check phone editor HTML and JS
        run: node web/tests/smoke.mjs
