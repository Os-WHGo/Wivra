# Milestone-controlled installer artifacts from the SAME unified Wivra source tree.
# By default PR changes run only contracts. To create APK/IPA explicitly,
# apply the owner-controlled 'wivra-package-beta' PR label or use workflow_dispatch
# once this workflow is available on the default branch. No secret credentials.
# APK = sideloadable debug build; IPA = UNSIGNED, cannot be installed on iPhone
# without a valid owner-provided signing process. Neither means "beta complete".
name: Wivra Complete Beta Assembly (Mobile)
on:
  push:
    branches:
      - chatgpt/wivra-beta-complete-assembly-20261016
      - chatgpt/wivra-unified-owner-20261016
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/wivra-complete-beta-assembly.yml'
      - 'streaming/**'
      - 'app/**'
      - 'core/**'
      - 'wivra-skill-pack/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wivra-beta-assembly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrated-contracts:
    name: Editor + Director + Native Contract Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate current editor HTML from this exact source commit
        run: |
          node app/build.mjs
          test -s app/dist/agentcut.html
          # The audit workflow alone synchronizes the committed HTML. It runs
          # in parallel and can publish the artifact after this check starts.
      - name: Editor functionality and project persistence
        run: node --test app/tests/*.test.mjs
      - name: Director/core project state, operations and tool contracts
        run: cd core && npm test
      - name: Ray-Ban, network, capture, audio and LIVE contracts
        run: node --test streaming/tests/*.test.mjs
      - name: Shared Wivra skill-pack regression checks
        run: python3 -m unittest discover -s wivra-skill-pack/tests -v
      - name: Write truthful integration snapshot
        run: |
          mkdir -p beta-artifacts
          cat > beta-artifacts/STATUS.txt <<EOF
          Wivra beta assembly candidate (NOT feature-complete or device-tested)
          Commit: ${{ github.sha }}
          Branch/ref: ${{ github.ref }}
          Camera and editor source packaged together, full beta checklist remains OPEN.
          Android artifact: DEBUG test APK; not Play Store release.
          iOS artifact: UNSIGNED arm64 IPA; not installable until owner signing.
          Real Ray-Ban glasses, external mic, RTMP LIVE and thermal tests NOT run in CI.
          Required review: https://github.com/Os-WHGo/Wivra/issues/121
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-Assembly-Status
          path: beta-artifacts/STATUS.txt
          retention-days: 21

  android-beta:
    name: Android APK · same unified editor
    needs: integrated-contracts
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'wivra-package-beta') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild offline editor from source before Android APK packaging
        run: node app/build.mjs && test -s app/dist/agentcut.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install free Android SDK packages
        run: |
          set -eu
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build Wivra editor + native Ray-Ban Android debug APK
        run: gradle -p streaming/android :app:assembleFullDebug :app:assembleCaptureDebug :app:assembleFullDebugAndroidTest --no-daemon --stacktrace
      - name: Verify bundled editor and filters, no second editor
        run: |
          set -eu
          apk=streaming/android/app/build/outputs/apk/full/debug/app-full-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'assets/agentcut.html'
          unzip -l "$apk" | grep -q 'assets/packs/catalog.json'
          # Compare bytes against the editor and resource catalog generated by this commit.
          # A matching filename alone does not prove the native shell shipped current code.
          unzip -p "$apk" assets/agentcut.html | cmp -s - app/dist/agentcut.html
          unzip -p "$apk" assets/packs/catalog.json | cmp -s - app/packs/catalog.json
          test -s streaming/android/app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
          # Capture remains an independent optional debug install; it is
          # packaged only on the same explicitly requested beta milestone.
          test -s streaming/android/app/build/outputs/apk/capture/debug/app-capture-debug.apk
      - name: Generate Android APK SHA-256 verification manifest
        run: |
          set -eu
          cd streaming/android/app/build/outputs/apk/full/debug
          sha256sum app-full-debug.apk > app-full-debug.apk.sha256
          sha256sum -c app-full-debug.apk.sha256
      - name: Publish Android APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-Android-SHA256
          path: streaming/android/app/build/outputs/apk/full/debug/app-full-debug.apk.sha256
          retention-days: 21
          if-no-files-found: error
      - name: Publish Android preview APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-Android-DEBUG-apk
          path: streaming/android/app/build/outputs/apk/full/debug/app-full-debug.apk
          retention-days: 21
          if-no-files-found: error
      - name: Publish compiled Android instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-Android-INSTRUMENTATION-apk
          path: streaming/android/app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
          retention-days: 21
          if-no-files-found: error

      - name: Generate independent Capture APK SHA-256 checksum
        run: |
          cd streaming/android/app/build/outputs/apk/capture/debug
          sha256sum app-capture-debug.apk > app-capture-debug.apk.sha256
          sha256sum -c app-capture-debug.apk.sha256
      - name: Publish optional Capture debug APK only for selected beta milestone
        uses: actions/upload-artifact@v4
        with:
          name: WivraCapture-RayBan-DEBUG
          path: streaming/android/app/build/outputs/apk/capture/debug/app-capture-debug.apk
          retention-days: 21
          if-no-files-found: error
      - name: Publish Capture debug APK checksum
        uses: actions/upload-artifact@v4
        with:
          name: WivraCapture-RayBan-SHA256
          path: streaming/android/app/build/outputs/apk/capture/debug/app-capture-debug.apk.sha256
          retention-days: 21
          if-no-files-found: error

  ios-beta:
    name: iPhone arm64 IPA · UNSIGNED
    needs: integrated-contracts
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'wivra-package-beta') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild offline editor from source before iPhone IPA packaging
        run: node app/build.mjs && test -s app/dist/agentcut.html
      - name: Xcode and local build tooling
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate iOS Wivra project without rewriting privacy declarations
        working-directory: streaming/ios/B0
        run: |
          set -eu
          xcodegen generate
          # XcodeGen info.path used to silently regenerate Info.plist with no privacy keys.
          # The checked-in plist must remain the single source of truth.
          git diff --exit-code -- Info.plist
      - name: Resolve official Meta Wearables packages
        working-directory: streaming/ios/B0
        run: xcodebuild -resolvePackageDependencies -project WivraMetaB0.xcodeproj -scheme WivraMetaB0
      - name: Compile unified Wivra for iOS Simulator
        working-directory: streaming/ios/B0
        run: |
          set -o pipefail
          xcodebuild -project WivraMetaB0.xcodeproj \
            -scheme WivraMetaB0 -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile unsigned Wivra for physical iPhone architecture
        working-directory: streaming/ios/B0
        run: |
          set -o pipefail
          xcodebuild -project WivraMetaB0.xcodeproj \
            -scheme WivraMetaB0 -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Check the SAME editor and filter packs in the iPhone app
        working-directory: streaming/ios/B0
        run: |
          set -eu
          app=.build/Build/Products/Debug-iphoneos/WivraMetaB0.app
          test -s "$app/agentcut.html"
          test -s "$app/packs/catalog.json"
          # Inspect the COMPILED plist, not just the checked-in source.
          # Without these permissions, iOS terminates the app when accessing hardware/Photos.
          for key in CFBundleDisplayName NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryAddUsageDescription NSBluetoothAlwaysUsageDescription NSLocalNetworkUsageDescription UIBackgroundModes CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" >/dev/null
          done
          /usr/libexec/PlistBuddy -c "Print :MWDAT:AppLinkURLScheme" "$app/Info.plist" >/dev/null
          # The optional selected-mic sidecar needs background audio, in addition
          # to Meta's Bluetooth and external-accessory transport modes.
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$app/Info.plist" | grep -qw audio
          # A signed IPA cannot launch without an executable and bundle identifier.
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          bundle_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app/Info.plist")
          test "$bundle_id" = "com.oswhgo.WivraMetaB0"
          test "$bundle_type" = "APPL"
          test -s "$app/$executable"
          for key in CFBundleName CFBundleVersion CFBundleShortVersionString; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" >/dev/null
          done
          # Byte-for-byte guard against stale editor/assets in the physical iPhone app.
          cmp -s "$app/agentcut.html" ../../../app/dist/agentcut.html
          cmp -s "$app/packs/catalog.json" ../../../app/packs/catalog.json
          for language in es en pt fr de ja zh it; do
            test -s "$app/${language}.lproj/Localizable.strings"
          done
          # W100: the screen-recording extension is embedded with ReplayKit's upload point.
          ext="$app/PlugIns/WivraScreenRecord.appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$ext/Info.plist")" = "com.apple.broadcast-services-upload"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist")" = "com.oswhgo.WivraMetaB0.ScreenRecord"
          test -s "$ext/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$ext/Info.plist")"
      - name: Package UNSIGNED IPA (owner must sign before installing)
        working-directory: streaming/ios/B0
        run: |
          set -eu
          mkdir -p .beta/Payload
          cp -R .build/Build/Products/Debug-iphoneos/WivraMetaB0.app .beta/Payload/
          (cd .beta && zip -qr ../Wivra-BETA-UNSIGNED.ipa Payload)
      - name: Verify privacy and Meta permissions INSIDE published unsigned IPA
        working-directory: streaming/ios/B0
        run: |
          set -eu
          ipa=Wivra-BETA-UNSIGNED.ipa
          unzip -p "$ipa" Payload/WivraMetaB0.app/Info.plist > /tmp/wivra-beta-compiled-info.plist
          for key in CFBundleDisplayName NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryAddUsageDescription NSBluetoothAlwaysUsageDescription NSLocalNetworkUsageDescription UIBackgroundModes CFBundleURLTypes; do
            /usr/libexec/PlistBuddy -c "Print :$key" /tmp/wivra-beta-compiled-info.plist >/dev/null
          done
          /usr/libexec/PlistBuddy -c "Print :MWDAT:AppLinkURLScheme" /tmp/wivra-beta-compiled-info.plist >/dev/null
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" /tmp/wivra-beta-compiled-info.plist | grep -qw audio
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/wivra-beta-compiled-info.plist)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /tmp/wivra-beta-compiled-info.plist)
          bundle_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' /tmp/wivra-beta-compiled-info.plist)
          test "$bundle_id" = "com.oswhgo.WivraMetaB0"
          test "$bundle_type" = "APPL"
          unzip -Z1 "$ipa" | grep -Fx "Payload/WivraMetaB0.app/$executable"
          for key in CFBundleName CFBundleVersion CFBundleShortVersionString; do
            /usr/libexec/PlistBuddy -c "Print :$key" /tmp/wivra-beta-compiled-info.plist >/dev/null
          done
          unzip -p "$ipa" Payload/WivraMetaB0.app/agentcut.html | cmp -s - ../../../app/dist/agentcut.html
          unzip -p "$ipa" Payload/WivraMetaB0.app/packs/catalog.json | cmp -s - ../../../app/packs/catalog.json
      - name: Generate iPhone unsigned IPA SHA-256 verification manifest
        run: |
          set -eu
          cd streaming/ios/B0
          shasum -a 256 Wivra-BETA-UNSIGNED.ipa > Wivra-BETA-UNSIGNED.ipa.sha256
          shasum -a 256 -c Wivra-BETA-UNSIGNED.ipa.sha256
      - name: Publish iPhone unsigned IPA checksum
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-iOS-SHA256
          path: streaming/ios/B0/Wivra-BETA-UNSIGNED.ipa.sha256
          retention-days: 21
          if-no-files-found: error
      - name: Publish unsigned IPA for future signing
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-BETA-iOS-UNSIGNED-ipa
          path: streaming/ios/B0/Wivra-BETA-UNSIGNED.ipa
          retention-days: 21
          if-no-files-found: error

  # Runs Android instrumentation instead of merely compiling it. Emulator is
  # synthetic and has no Meta glasses, external mic, camera QA or RTMP service.
  # Public repository + standard GitHub-hosted Ubuntu runner; no paid device lab.
  android-media-emulator:
    name: Android emulator · MediaStore + offline WebView editor
    needs: android-beta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Wivra-BETA-Android-DEBUG-apk
          path: .ci/media-app
      - uses: actions/download-artifact@v4
        with:
          name: Wivra-BETA-Android-INSTRUMENTATION-apk
          path: .ci/media-tests
      - name: Allow hardware-accelerated Android emulator on Ubuntu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute real OS media handoff checks in Android 35 emulator
        # ReactiveCircus android-emulator-runner v2, pinned to verified commit.
        # Apache-2.0; no changes to production APK or app dependencies.
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r .ci/media-app/app-full-debug.apk
            adb install -r .ci/media-tests/app-full-debug-androidTest.apk
            mkdir -p .ci/results
            adb shell am instrument -w -r -e class com.oswhgo.wivra.WivraPhoneMediaStoreTest,com.oswhgo.wivra.WivraEditorWebViewTest,com.oswhgo.wivra.WivraExportStoreTest,com.oswhgo.wivra.WivraExportBridgeWebViewTest,com.oswhgo.wivra.WivraRealExportWebViewTest,com.oswhgo.wivra.WivraCaptureMediaVerifierTest,com.oswhgo.wivra.WivraDirectorSaveJournalTest,com.oswhgo.wivra.WivraCapturePublicationReceiptTest,com.oswhgo.wivra.WivraCaptureVerifierWebViewTest com.oswhgo.wivra.test/androidx.test.runner.AndroidJUnitRunner | tee .ci/results/media-handoff.txt
            grep -Eq '^OK \([0-9]+ tests?\)' .ci/results/media-handoff.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed' .ci/results/media-handoff.txt
      - name: Preserve emulator instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-Android-MediaStore-Emulator-Results
          path: .ci/results/
          retention-days: 21
          if-no-files-found: warn
