name: IRL local marker tests
on:
  pull_request:
    paths:
      - 'irl/**'
      - '.github/workflows/irl-marker-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test irl/tests/irl-project.test.mjs
