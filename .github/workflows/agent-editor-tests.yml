name: Mobile Agent Editor Tests
on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/agent-editor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run existing editor smoke test
        run: node web/tests/smoke.mjs
      - name: Run deterministic agent-core tests
        run: node --test web/tests/agent-core.test.mjs
      - name: Parse new browser modules
        run: node --check web/agent-core.mjs && node --check web/agent-vision.mjs
