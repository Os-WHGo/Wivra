# Two-camera capture bundle → real editor (Chromium, synthetic media). Small and
# independent from the long accelerated-export matrix. Not a phone test. — Claude
name: Wivra Multicam Editor Import
on:
  pull_request:
    paths:
      - app/capture-manifest.mjs
      - app/template.html
      - app/build.mjs
      - core/multicam-plan.mjs
      - app/export.mjs
      - tools/browser-capture-to-export.cjs
      - tools/browser-multicam-import.cjs
      - .github/workflows/wivra-multicam-editor-import.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tester, never app runtime
        run: npm install --prefix /tmp/wivra-media-lab --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium and ffmpeg
        run: |
          node /tmp/wivra-media-lab/node_modules/playwright/cli.js install --with-deps chromium
          if ! command -v ffmpeg >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Rebuild the editor from source
        run: node app/build.mjs
      - name: Import two-camera bundles (valid, earlier start, unknown offset, missing, unreadable, corrupt, single)
        run: node tools/browser-multicam-import.cjs
      - name: W75 end-to-end capture → editor → stable export (PiP pixels, main-camera audio, duration)
        run: node tools/browser-capture-to-export.cjs
