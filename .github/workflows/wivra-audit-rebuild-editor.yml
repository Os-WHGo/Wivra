name: Wivra Audit · Rebuild Editor Bundle
on:
  push:
    branches:
      - chatgpt/wivra-unified-owner-20261016
    paths:
      - 'app/build.mjs'
      - 'app/template.html'
      - 'app/*.mjs'
      - 'app/tests/**'
      - 'app/dist/agentcut.html'
      - 'app/i18n/**'
      - 'core/*.mjs'
      - '.github/workflows/wivra-audit-rebuild-editor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wivra-audit-editor-bundle
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild deterministic editor and run regression suite
        run: |
          node app/build.mjs
          node --test app/tests/*.test.mjs
          (cd core && npm test)
      - name: Commit generated HTML only on audit integration branch
        run: |
          test "$GITHUB_REF_NAME" = "chatgpt/wivra-unified-owner-20261016"
          if ! git diff --quiet -- app/dist/agentcut.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- app/dist/agentcut.html
            git commit -m "build(editor): synchronize deterministic Wivra HTML bundle"
            git push origin HEAD:refs/heads/chatgpt/wivra-unified-owner-20261016
          fi
