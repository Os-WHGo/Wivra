name: Quality Planner Tests
on:
  pull_request:
    paths:
      - 'quality/**'
      - '.github/workflows/quality-planner-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test mobile quality planner
        run: node --test quality/tests/planner.test.mjs
