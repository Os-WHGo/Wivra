name: Wivra AI Candidate Smoke Bench (isolated, no app weights)
on:
  push:
    branches:
      - chatgpt/wivra-unified-owner-20261016
    paths:
      - tools/ai_benchmark_silero.py
      - .github/workflows/wivra-ai-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silero-cpu-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated ONNX inference only (not mobile app)
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 onnxruntime==1.22.1
      - name: Run REAL Silero ONNX with pinned public fixture and synthetic controls
        run: python tools/ai_benchmark_silero.py > ai-smoke-results.json
      - name: Show transparent results and limitations
        if: success()
        run: cat ai-smoke-results.json
      - name: Attach benchmark result only, not downloaded models
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wivra-AI-Silero-CPU-Smoke-Only
          path: ai-smoke-results.json
          retention-days: 7
