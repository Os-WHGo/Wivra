name: Wivra AI Chat-First UI Smoke
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/chat-first-ui-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild production HTML and ensure generated artifact remains in sync
        run: node app/build.mjs && git diff --exit-code -- app/dist/agentcut.html
      - name: Chat-first UI and safe AI dispatch contract
        run: node --test app/tests/chat-first-ui.test.mjs
