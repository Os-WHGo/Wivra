name: Wivra Android UI Screenshots (Emulator)
# W81 (Claude): lets the owner SEE native Android screens without installing
# anything. A debug build is installed only inside this CI emulator; only PNG
# screenshots leave the runner. No APK artifact, no device, no store upload.
on:
  pull_request:
    paths:
      - 'streaming/android/**'
      - 'app/template.html'
      - '.github/workflows/wivra-android-ui-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wivra-android-screens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install free Android SDK packages
        run: |
          set -eu
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build current editor
        run: node app/build.mjs && test -s app/dist/agentcut.html
      - name: Build the debug app for the emulator only
        run: gradle -p streaming/android :app:assembleFullDebug :app:assembleFullDebugAndroidTest --no-daemon --stacktrace
      - name: Allow hardware-accelerated Android emulator on Ubuntu
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Take screenshots in an Android 35 emulator
        # Same pinned ReactiveCircus/android-emulator-runner commit as the beta workflow (Apache-2.0).
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r streaming/android/app/build/outputs/apk/full/debug/app-full-debug.apk
            # W105: the W99 local screen recording, recorded for real (no network, no microphone),
            # before the app language is changed for the screenshots.
            adb install -r streaming/android/app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.oswhgo.wivra.WivraScreenRecordInstrumentedTest com.oswhgo.wivra.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/screen-record.txt"
            grep -E 'WIVRA-SCREENREC|shortMsg|Error|assert' "$RUNNER_TEMP/screen-record.txt" || true
            grep -Eq '^OK \(1 test\)' "$RUNNER_TEMP/screen-record.txt"
            adb shell cmd locale set-app-locales com.oswhgo.wivra --locales es-ES || true
            mkdir -p "$RUNNER_TEMP/wivra-screens"
            adb shell pm grant com.oswhgo.wivra android.permission.CAMERA || true
            adb shell pm grant com.oswhgo.wivra android.permission.RECORD_AUDIO || true
            adb shell am start -W -S -n com.oswhgo.wivra/.MainActivity --es wivra_screenshot tour; sleep 18; adb exec-out screencap -p > "$RUNNER_TEMP/wivra-screens/2-bienvenida.png"
            sleep 9; adb exec-out screencap -p > "$RUNNER_TEMP/wivra-screens/3-portada.png"
            sleep 9; adb exec-out screencap -p > "$RUNNER_TEMP/wivra-screens/4-capturar.png"
            # W99: the local screen-recording screen (no stream key, so no FLAG_SECURE).
            adb shell am start -W -S -n com.oswhgo.wivra/.MainActivity --es wivra_screenshot screenrec; sleep 14; adb exec-out screencap -p > "$RUNNER_TEMP/wivra-screens/5-grabar-pantalla.png"
            # LIVE screens use FLAG_SECURE (the stream key must never appear in a
            # screenshot), so they are not photographed here on purpose.
            adb shell am force-stop com.oswhgo.wivra
            ls -la "$RUNNER_TEMP/wivra-screens"
            test -z "$(find "$RUNNER_TEMP/wivra-screens" -type f ! -name '*.png')"
      - name: Small previews in the log (artifact storage is not reachable for every reviewer)
        if: always()
        run: |
          python3 -m pip install --quiet --user pillow
          for f in "$RUNNER_TEMP"/wivra-screens/*.png; do
            [ -f "$f" ] || continue
            python3 -c 'import sys; from PIL import Image; im = Image.open(sys.argv[1]).convert("RGB"); im.thumbnail((640, 1500)); im.save(sys.argv[2], quality=55)' "$f" "$RUNNER_TEMP/preview.jpg"
            echo "WIVRA-SCREEN-BEGIN $(basename "$f")"; base64 -w0 "$RUNNER_TEMP/preview.jpg"; echo; echo "WIVRA-SCREEN-END"
            rm -f "$RUNNER_TEMP/preview.jpg"
          done
      - name: Upload screenshots (PNG only)
        uses: actions/upload-artifact@v4
        with:
          name: wivra-android-screens
          path: ${{ runner.temp }}/wivra-screens/*.png
          if-no-files-found: error
          retention-days: 14
